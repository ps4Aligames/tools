name: Build Smart Repair EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name "Smart_Repair_Edition_Ali_Games" --add-data "assets;assets" main.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Smart_Repair_Edition_Ali_Games.exe release/
          Copy-Item wetool.exe release/
          Compress-Archive -Path release/* -DestinationPath Smart_Repair_Edition_Ali_Games.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Repair-Edition-Ali-Games
          path: Smart_Repair_Edition_Ali_Games.zip
